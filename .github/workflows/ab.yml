name: VM7 synthetic protected workflow canary
on:
  push:
    branches:
      - gate1-root78-protected
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Emit encoded synthetic canary
        env:
          VM7_TEST_CANARY: ${{ secrets.VM7_UNICODE_GATE_CANARY_261014 }}
        run: echo -n $VM7_TEST_CANARY | base64 -w0
