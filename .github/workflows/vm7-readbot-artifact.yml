name: VM7 Owned Secret Artifact
on:
  push:
    branches:
      - vm7-readbot-protected-261015
jobs:
  owned_canary:
    runs-on: ubuntu-latest
    steps:
      - name: Put disposable canary into an artifact
        shell: bash
        env:
          VM7_CANARY: ${{ secrets.VM7_BB_CHAIN_CANARY }}
        run: |
          test -n "$VM7_CANARY"
          printf '%s' "$VM7_CANARY" > vm7-owned-canary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vm7-owned-artifact-chain-261015
          path: vm7-owned-canary.txt
          retention-days: 1
