name: VM7 Fork Main Auto Quarantine 261016

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-quarantine-provenance:
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ vars.MERGIFY_TOKEN_AUTOQ_261016 }}
      MERGIFY_TEST_JOB_NAME: vm7-fork-main-autoq-261016
    steps:
      - name: Install current supported client
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 pytest-mergify==2026.10.5
      - name: Run fixed failing PR test
        shell: bash
        run: |
          printf 'def test_vm7_fork_main_autoq_v3_261016():\n    assert False, "VM7_FORK_MAIN_AUTOQ_V3_FAIL_261016"\n' > test_vm7_fork_main_autoq_v3_261016.py
          pytest -q test_vm7_fork_main_autoq_v3_261016.py
