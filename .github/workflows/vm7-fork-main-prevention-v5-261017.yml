name: VM7 Fork Main Prevention Gate V5C 261017

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  prevention-gate:
    name: vm7-prevention-gate-v5-261017
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ vars.MERGIFY_TOKEN_RETRY_261017 }}
      MERGIFY_TEST_JOB_NAME: vm7-fork-main-prevention-v5c-261017
    steps:
      - name: Install exact supported Test Engine client
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 pytest-mergify==2026.10.5
      - name: Run fixed target-owned Prevention test
        shell: bash
        env:
          VM7_MODE: ${{ github.event_name == 'workflow_dispatch' && 'seed' || github.event.pull_request.head.ref == 'main' && 'poison' || 'consumer' }}
        run: |
          cat > test_vm7_fork_main_prevention_v5_261017.py <<'PY'
          import os
          from pathlib import Path

          def test_vm7_fork_main_prevention_v5c_seed_261017():
              assert True

          if os.environ["VM7_MODE"] != "seed":
            def test_vm7_fork_main_prevention_v5c_261017():
              if os.environ["VM7_MODE"] == "poison":
                  assert True
                  return

              marker = Path("/tmp/vm7-fork-main-prevention-v5c-attempt-261017")
              if not marker.exists():
                  marker.write_text("first invocation passed\n")
                  assert True
                  return

              raise AssertionError("VM7_PREVENTION_V5C_RERUN_FAILURE_261017")
          PY
          pytest -q -s test_vm7_fork_main_prevention_v5_261017.py
