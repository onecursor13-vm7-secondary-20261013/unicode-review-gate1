name: VM7 Cross Repo Status Binding 261015

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  post-success:
    name: Post exact commit status
    runs-on: ubuntu-latest
    steps:
      - name: Create successful commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          payload="$(jq -nc \
            '{state:"success",context:"VM7 Cross Repo Status 261015",description:"VM7 cross-repository status control"}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            --data "$payload" >/dev/null
