name: VM7 Fork Main Test Retry V4 261017

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fixed-target-test:
    name: retry-provenance-v4
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ vars.MERGIFY_TOKEN_RETRY_261017 }}
      MERGIFY_TEST_JOB_NAME: vm7-fork-main-retry-v4-261017
      VM7_MODE: ${{ github.event.pull_request.head.ref == 'main' && contains(github.event.pull_request.title, '[VM7-PASS20]') && 'pass20' || github.event.pull_request.head.ref == 'main' && 'attack-fail' || 'consumer' }}
    steps:
      - name: Install exact supported Test Engine client
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 pytest-mergify==2026.10.5
      - name: Run fixed target-owned provenance and retry test
        shell: bash
        run: |
          if [[ "$VM7_MODE" == "attack-fail" ]]; then
            cat > test_vm7_fork_main_retry_v4_261017.py <<'PY'
          def test_vm7_fork_main_retry_v4_261017():
              raise AssertionError("VM7_FORK_MAIN_RETRY_V4_ATTACK_FAILURE_261017")
          PY
            pytest -q -s test_vm7_fork_main_retry_v4_261017.py
          elif [[ "$VM7_MODE" == "pass20" ]]; then
            cat > test_vm7_fork_main_retry_v4_261017.py <<'PY'
          def test_vm7_fork_main_retry_v4_261017():
              assert True
          PY
            for iteration in $(seq 1 20); do
              echo "controlled pass iteration ${iteration}"
              pytest -q -s test_vm7_fork_main_retry_v4_261017.py
            done
          else
            cat > test_vm7_fork_main_retry_v4_261017.py <<'PY'
          from pathlib import Path

          def test_vm7_fork_main_retry_v4_261017():
              marker = Path("/tmp/vm7-fork-main-retry-v4-attempt-261017")
              if not marker.exists():
                  marker.write_text("first attempt consumed\n")
                  raise AssertionError("VM7_FORK_MAIN_RETRY_V4_FIRST_ATTEMPT_261017")
              assert marker.read_text() == "first attempt consumed\n"
          PY
            pytest -q -s test_vm7_fork_main_retry_v4_261017.py
          fi
