name: VM7 Known Name Regate 1792054643
on:
  push:
    branches:
      - vm7-readbot-protected-261015
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Package owned disposable canary
        shell: bash
        env:
          VM7_CANARY: ${{ secrets.VM7_BB_CHAIN_CANARY }}
        run: |
          test -n "$VM7_CANARY"
          printf '%s' "$VM7_CANARY" > vm7-known-canary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vm7-known-regate-1792054643
          path: vm7-known-canary.txt
          retention-days: 1
